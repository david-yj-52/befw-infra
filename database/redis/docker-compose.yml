version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-cira
    restart: unless-stopped
    ports:
      - "${REDIS_TCP_PORT:-5672}:6379"
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-your_secure_password}"
    volumes:
      # 상대 경로 방식 (docker-compose.yml이 있는 위치 기준 ./data 폴더에 저장)
      - "${REDIS_DEFAULT_DIR:-./data}:/data"

    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-your_secure_password}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    ports:
      - "${REDIS_MGMT_PORT:-15672}:5544"
    depends_on:
      - redis