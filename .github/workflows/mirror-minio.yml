name: Mirror MinIO to GHCR

on:
  workflow_dispatch:
  schedule:
    # 매달 1일 03:00 UTC — MinIO 최신 릴리스로 갱신
    - cron: '0 3 1 * *'

env:
  MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
  IMAGE: ghcr.io/${{ github.repository_owner }}/minio

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone MinIO source
        run: |
          git clone --depth 1 --branch ${{ env.MINIO_VERSION }} \
            https://github.com/minio/minio.git /tmp/minio-src

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: /tmp/minio-src
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.MINIO_VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
