name: Mirror MinIO to GHCR

on:
  workflow_dispatch:
  schedule:
    # 매달 1일 03:00 UTC — MinIO 최신 릴리스로 갱신
    - cron: '0 3 1 * *'

env:
  MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
  IMAGE: ghcr.io/${{ github.repository_owner }}/minio

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: storage/minio
          file: storage/minio/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.MINIO_VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: |
            MINIO_VERSION=${{ env.MINIO_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
